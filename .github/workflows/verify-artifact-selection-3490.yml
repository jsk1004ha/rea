name: Verify selected artifact extraction
on:
  push:
    branches: [work/artifact-selection-3490]
permissions:
  contents: write
concurrency:
  group: verify-artifact-selection-3490
  cancel-in-progress: false
env:
  HUSKY: "0"
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Prepare the proposed change on its exact base
        env:
          PREPARE_SCRIPT: ""
        run: |
          python3 - <<'PYTHON'
          import os, base64, zlib
          from pathlib import Path
          Path('/tmp/prepare-3490.py').write_bytes(zlib.decompress(base64.b64decode(os.environ['PREPARE_SCRIPT'])))
          PYTHON
          git checkout --detach 6fcfc5b5e0c063300cd5278dd8bad5b1ab1374f6
          python3 /tmp/prepare-3490.py
      - name: Install the pinned toolchain and dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci
      - name: Format the changed source
        run: xargs -d '\n' npm exec -- oxfmt < /tmp/rea-3490-changed.txt
      - name: Publish the implementation for review
        run: |
          git config user.name jsk1004ha
          git config user.email 129354802+jsk1004ha@users.noreply.github.com
          git add --pathspec-from-file=/tmp/rea-3490-changed.txt
          git diff --cached --check
          git commit -m "feat(artifacts): select extraction entries and output destination" -m "Refs morluto/rea#3490"
          git push --force-with-lease=refs/heads/feat/artifact-selection-3490: origin HEAD:refs/heads/feat/artifact-selection-3490
      - name: Artifact regression tests
        run: |
          npm run test:focused -- \
            tests/boundary/providers/native/artifactProvider.extractionSelection.test.ts \
            tests/boundary/providers/native/artifactProvider.extraction.test.ts \
            tests/boundary/providers/native/artifactProvider.archiveSafety.test.ts \
            tests/boundary/providers/native/artifactProvider.extractionIdentity.test.ts \
            tests/boundary/providers/native/artifactProvider.extractionFormat.test.ts \
            tests/boundary/providers/native/artifactProvider.universalExtraction.test.ts
      - name: Static checks
        if: ${{ !cancelled() }}
        run: npm run check
      - name: Documentation and catalog checks
        if: ${{ !cancelled() }}
        run: npm run docs:check
