name: Verify selected artifact extraction
on:
  push:
    branches: [work/artifact-selection-3490]
concurrency:
  group: verify-artifact-selection-3490
  cancel-in-progress: false
env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5901a36324b6660c1a5964581418074cdb22c20f
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Fix optional-value ownership and the typed refusal assertion
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          contract = Path('src/contracts/artifactToolContracts.ts')
          text = contract.read_text()
          start = text.index('/** Omitted selection')
          end = text.index('/** Provider input', start)
          section = text[start:end]
          assert section.count('.optional()') == 2
          contract.write_text(text[:start] + section.replace('.optional()', '.exactOptional()') + text[end:])
          test = Path('tests/boundary/providers/native/artifactProvider.extractionSelection.test.ts')
          text = test.read_text()
          old = ').toThrow("not a regular file or slice exposed by the active reader");'
          new = ''' ).toThrowError(expect.objectContaining({
            _tag: "AnalysisInputError",
            issues: [expect.objectContaining({
              path: ["occurrence_ids"],
              reason: "invalid_value",
              message: expect.stringContaining("not a regular file or slice exposed by the active reader"),
            })],
          }));'''
          assert text.count(old) == 1
          test.write_text(text.replace(old, new))
          PYTHON
      - name: Install pinned dependencies and format the changed files
        run: |
          npm install --global npm@11.16.0
          npm ci
          npm exec -- oxfmt src/contracts/artifactToolContracts.ts tests/boundary/providers/native/artifactProvider.extractionSelection.test.ts
      - name: Publish exact source for validation
        id: publish
        run: |
          git config user.name jsk1004ha
          git config user.email 129354802+jsk1004ha@users.noreply.github.com
          git add src/contracts/artifactToolContracts.ts tests/boundary/providers/native/artifactProvider.extractionSelection.test.ts
          git diff --cached --check
          git commit -m "fix(artifacts): keep optional selection inputs JSON-safe"
          git push origin HEAD:refs/heads/feat/artifact-selection-3490
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Extraction, ownership and public CLI/MCP tests
        run: |
          npm run test:focused -- \
            tests/boundary/providers/native/artifactProvider.extractionSelection.test.ts \
            tests/boundary/providers/native/artifactProvider.extractionDestination.test.ts \
            tests/boundary/providers/native/artifactProvider.extraction.test.ts \
            tests/boundary/providers/native/artifactProvider.archiveSafety.test.ts \
            tests/boundary/providers/native/artifactProvider.extractionIdentity.test.ts \
            tests/boundary/providers/native/artifactProvider.extractionFormat.test.ts \
            tests/boundary/providers/native/artifactProvider.universalExtraction.test.ts \
            tests/boundary/filesystem/safeOutputTree.test.ts \
            tests/boundary/filesystem/safeOutputTreeCloseFailures.test.ts \
            tests/boundary/filesystem/artifactLiteralBackslash.test.ts \
            tests/acceptance/artifactExtractionSelection.test.ts
      - name: Static checks and test discovery
        if: ${{ !cancelled() }}
        run: |
          npm run check
          npm run verify:test-discovery
      - name: Documentation and catalog checks
        if: ${{ !cancelled() }}
        run: npm run docs:check
  macos:
    needs: verify
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install pinned dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci
      - name: Verify macOS output safety and CLI/MCP parity
        run: |
          npm run test:focused -- \
            tests/boundary/providers/native/artifactProvider.extractionSelection.test.ts \
            tests/boundary/providers/native/artifactProvider.extractionDestination.test.ts \
            tests/boundary/providers/native/artifactProvider.extraction.test.ts \
            tests/boundary/providers/native/artifactProvider.archiveSafety.test.ts \
            tests/boundary/filesystem/safeOutputTree.test.ts \
            tests/acceptance/artifactExtractionSelection.test.ts
