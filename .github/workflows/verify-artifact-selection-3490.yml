name: Verify selected artifact extraction
on:
  push:
    branches: [work/artifact-selection-3490]
permissions:
  contents: read
concurrency:
  group: verify-artifact-selection-3490
  cancel-in-progress: false
env:
  HUSKY: "0"
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 60c3c213d736757e057598fab49a7b1d999a0792
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install pinned dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci
          git diff --check
      - name: Artifact regression tests
        run: |
          npm run test:focused -- \
            tests/boundary/providers/native/artifactProvider.extractionSelection.test.ts \
            tests/boundary/providers/native/artifactProvider.extraction.test.ts \
            tests/boundary/providers/native/artifactProvider.archiveSafety.test.ts \
            tests/boundary/providers/native/artifactProvider.extractionIdentity.test.ts \
            tests/boundary/providers/native/artifactProvider.extractionFormat.test.ts \
            tests/boundary/providers/native/artifactProvider.universalExtraction.test.ts
      - name: Static checks and test discovery
        if: ${{ !cancelled() }}
        run: |
          npm run check
          npm run verify:test-discovery
      - name: Documentation and catalog checks
        if: ${{ !cancelled() }}
        run: npm run docs:check
      - name: Actual CLI and stdio MCP selection
        if: ${{ !cancelled() }}
        run: |
          npm run build:cached
          node --input-type=module <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import { mkdtemp, readFile, writeFile, readdir, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          import { TextReader, Uint8ArrayWriter, ZipWriter } from '@zip.js/zip.js';
          import { artifactCli, artifactMcpResult, withArtifactMcp } from './scripts/lib/artifact-e2e.mjs';
          const root = await mkdtemp(join(tmpdir(), 'rea-3490-public-'));
          try {
            const archive = join(root, 'fixture.zip');
            const writer = new ZipWriter(new Uint8ArrayWriter());
            await writer.add('lib/arm64-v8a/selected.so', new TextReader('native fixture'));
            await writer.add('lib/x86_64/other.so', new TextReader('other architecture'));
            await writer.add('res/2f.xml', new TextReader('lower'));
            await writer.add('res/2F.xml', new TextReader('upper'));
            const bytes = await writer.close();
            await writeFile(archive, bytes);
            const digest = (value) => createHash('sha256').update(value).digest('hex');
            const inspection = await artifactCli('inspect-artifact', archive);
            const inventory = inspection.substeps.find(({ evidence }) => evidence.operation === 'inventory_artifact').evidence.normalized_result;
            const id = inventory.occurrences.find(({ logical_path }) => logical_path === 'lib/arm64-v8a/selected.so').occurrence_id;
            const second = inventory.occurrences.find(({ logical_path }) => logical_path === 'lib/x86_64/other.so').occurrence_id;
            const cliOutput = join(root, 'cli-output');
            const cli = await artifactCli('extract-artifact', archive, ['--output-root', cliOutput, '--occurrence-id', id]);
            assert.equal(cli.output_root, cliOutput);
            assert.deepEqual(cli.artifacts.map(({ relative_path }) => relative_path), ['lib/arm64-v8a/selected.so']);
            assert.deepEqual(cli.extraction_manifest.selected_occurrence_ids, [id]);
            assert.equal(await readFile(join(cliOutput, 'lib/arm64-v8a/selected.so'), 'utf8'), 'native fixture');
            assert.deepEqual(await readdir(cliOutput), ['lib']);
            const repeated = await artifactCli('extract-artifact', archive, ['--output-root', join(root, 'cli-two'), '--occurrence-id', id, '--occurrence-id', second]);
            assert.equal(repeated.artifacts.length, 2);
            await withArtifactMcp(archive, async (client) => {
              const mcpOutput = join(root, 'mcp-output');
              const mcp = await artifactMcpResult(client, 'extract_artifact', { output_root: mcpOutput, occurrence_ids: [id] });
              assert.equal(mcp.output_root, mcpOutput);
              assert.deepEqual(mcp.extraction_manifest, cli.extraction_manifest);
              assert.deepEqual(mcp.artifacts, cli.artifacts);
              const bad = await client.callTool({ name: 'extract_artifact', arguments: { output_root: join(root, 'invalid-output'), occurrence_ids: ['occ_' + '0'.repeat(64)] } });
              assert.equal(bad.isError, true);
              await artifactMcpResult(client, 'close_binary');
              assert.equal(await readFile(join(mcpOutput, 'lib/arm64-v8a/selected.so'), 'utf8'), 'native fixture');
            });
            assert.equal(digest(await readFile(archive)), digest(bytes));
            console.log(JSON.stringify({ check: 'CLI/MCP selected extraction', cli_files: cli.artifacts.length, repeated_flag_files: repeated.artifacts.length, manifest_parity: true, source_unchanged: true, invalid_id_rejected: true, files_persist_after_close: true }));
          } finally {
            await rm(root, { recursive: true, force: true });
          }
          JAVASCRIPT
