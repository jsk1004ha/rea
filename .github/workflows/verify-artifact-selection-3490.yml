name: Verify selected artifact extraction
on:
  push:
    branches: [work/artifact-selection-3490]
permissions:
  contents: write
concurrency:
  group: verify-artifact-selection-3490
  cancel-in-progress: false
env:
  HUSKY: "0"
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 60c3c213d736757e057598fab49a7b1d999a0792
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Apply source-boundary and regression refinements
        env:
          PATCH: 
        run: |
          python3 - <<'PYTHON'
          import os, base64, zlib, subprocess
          from pathlib import Path
          script=Path('/tmp/refine-3490.py')
          script.write_bytes(zlib.decompress(base64.b64decode(os.environ['PATCH'])))
          subprocess.run(['python3',str(script)],check=True)
          p=Path('docs/mcp-contracts.md')
          text=p.read_text()
          old='output and reports any cleanup failure.'
          assert text.count(old)==1
          p.write_text(text.replace(old,old+'\nAn output root inside the source directory, including a symlink alias, is refused.'))
          with open('/tmp/rea-3490-refined.txt','a') as f: f.write('docs/mcp-contracts.md\n')
          PYTHON
      - name: Install pinned dependencies and format the changed files
        run: |
          npm install --global npm@11.16.0
          npm ci
          xargs -d '\n' npm exec -- oxfmt < /tmp/rea-3490-refined.txt
      - name: Publish exact source for validation
        run: |
          git config user.name jsk1004ha
          git config user.email 129354802+jsk1004ha@users.noreply.github.com
          git add --pathspec-from-file=/tmp/rea-3490-refined.txt
          git diff --cached --check
          git commit -m "fix(artifacts): protect source directories and verify public selection"
          git push origin HEAD:refs/heads/feat/artifact-selection-3490
          git rev-parse HEAD
      - name: Extraction, ownership and public CLI/MCP tests
        run: |
          npm run test:focused -- \
            tests/boundary/providers/native/artifactProvider.extractionSelection.test.ts \
            tests/boundary/providers/native/artifactProvider.extractionDestination.test.ts \
            tests/boundary/providers/native/artifactProvider.extraction.test.ts \
            tests/boundary/providers/native/artifactProvider.archiveSafety.test.ts \
            tests/boundary/providers/native/artifactProvider.extractionIdentity.test.ts \
            tests/boundary/providers/native/artifactProvider.extractionFormat.test.ts \
            tests/boundary/providers/native/artifactProvider.universalExtraction.test.ts \
            tests/boundary/filesystem/safeOutputTree.test.ts \
            tests/boundary/filesystem/safeOutputTreeCloseFailures.test.ts \
            tests/boundary/filesystem/artifactLiteralBackslash.test.ts \
            tests/acceptance/artifactExtractionSelection.test.ts
      - name: Static checks and test discovery
        if: ${{ !cancelled() }}
        run: |
          npm run check
          npm run verify:test-discovery
      - name: Documentation and catalog checks
        if: ${{ !cancelled() }}
        run: npm run docs:check
